<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="suturaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#902e2a" />
      <stop offset="100%" stop-color="#ba1a1a" />
    </linearGradient>
  </defs>
  <!-- Fond carré arrondi élégant -->
  <rect width="512" height="512" rx="120" fill="url(#suturaGrad)" />
  
  <!-- Point lumineux santé (Téranga & Espérance) -->
  <circle cx="390" cy="120" r="30" fill="#aeeecb" />
  
  <!-- Lettre Serif S stylisée officielle -->
  <text x="256" y="365" font-family="'Newsreader', 'Georgia', serif" font-size="320" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  
  <!-- Courbe protectrice Sutura -->
  <path d="M140 420 Q 256 460 372 420" fill="none" stroke="#aeeecb" stroke-width="18" stroke-linecap="round" opacity="0.9" />
</svg>